<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <title>Pundachi Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="hero">
      <p class="eyebrow">CAMERA</p>
      <h1>Pundachi Tracker</h1>
      <p class="subtitle">Real-time Pundachi detector.</p>
    </section>

    <section class="card">
      <div class="video-wrap">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div id="status" class="status">Camera is off</div>
      </div>

      <div class="controls">
        <button id="startBtn">Start Camera</button>
        <button id="stopBtn" class="secondary" disabled>Stop</button>
      </div>

      <div class="stats">
        <div><span>Faces detected</span><strong id="faceCount">0</strong></div>
        <div><span>Camera</span><strong id="cameraState">Off</strong></div>
      </div>

      <p class="note">Camera access requires HTTPS. On GitHub Pages, your site will automatically use HTTPS.</p>
    </section>

    <footer>
      Built with MediaPipe Face Detection • No video is uploaded by this page.
    </footer>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
